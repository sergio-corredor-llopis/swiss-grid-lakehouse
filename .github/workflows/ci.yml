name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: pytest -q -m "not spark"

  spark:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: ivy-${{ runner.os }}-
      - run: python -m pip install --upgrade pip && pip install -e ".[dev,spark]"
      - run: pytest -q -m spark
      - name: Bronze -> Silver twice
        run: |
          out="$RUNNER_TEMP/lakehouse"
          python -m swiss_grid_lakehouse.bronze --xml tests/fixtures/entsoe_ch_load_sample.xml --target "$out/bronze"
          python -m swiss_grid_lakehouse.silver --bronze "$out/bronze" --target "$out/silver" | tee "$out/run1.txt"
          python -m swiss_grid_lakehouse.silver --bronze "$out/bronze" --target "$out/silver" | tee "$out/run2.txt"
          grep -q "merged inserted=48 updated=0 rows=48" "$out/run1.txt"
          grep -q "merged inserted=0 updated=0 rows=48" "$out/run2.txt"
