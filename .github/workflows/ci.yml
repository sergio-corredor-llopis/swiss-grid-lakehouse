name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: pytest -q -m "not spark"

  spark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: ivy-${{ runner.os }}-
      - run: python -m pip install --upgrade pip && pip install -e ".[dev,spark,swissgrid]"
      - run: pytest -q -m spark
      - name: Bronze -> Silver twice
        run: |
          out="$RUNNER_TEMP/lakehouse"
          for run in 1 2; do
            python -m swiss_grid_lakehouse.bronze --xml tests/fixtures/entsoe_ch_load_2026-08-30.xml --target "$out/bronze_entsoe"
          done
          python -m swiss_grid_lakehouse.silver --bronze "$out/bronze_entsoe" --target "$out/silver" --source entsoe | tee "$out/entsoe_run1.txt"
          python -m swiss_grid_lakehouse.silver --bronze "$out/bronze_entsoe" --target "$out/silver" --source entsoe | tee "$out/entsoe_run2.txt"
          grep -q "merged inserted=48 updated=0 rows=48" "$out/entsoe_run1.txt"
          grep -q "merged inserted=0 updated=0 rows=48" "$out/entsoe_run2.txt"
      - name: Swissgrid Bronze -> Silver twice
        run: |
          out="$RUNNER_TEMP/lakehouse"
          for run in 1 2; do
            python -m swiss_grid_lakehouse.bronze --swissgrid tests/fixtures/swissgrid_ch_energy_2026-08-30.csv --target "$out/bronze_swissgrid"
          done
          python -m swiss_grid_lakehouse.silver --bronze "$out/bronze_swissgrid" --target "$out/silver" --source swissgrid | tee "$out/swissgrid_run1.txt"
          python -m swiss_grid_lakehouse.silver --bronze "$out/bronze_swissgrid" --target "$out/silver" --source swissgrid | tee "$out/swissgrid_run2.txt"
          grep -q "merged inserted=48 updated=0 rows=48" "$out/swissgrid_run1.txt"
          grep -q "merged inserted=0 updated=0 rows=48" "$out/swissgrid_run2.txt"
      - name: Compare
        run: python -m swiss_grid_lakehouse.compare --silver "$RUNNER_TEMP/lakehouse/silver"
      - name: Pipeline twice, run history
        run: |
          out="$RUNNER_TEMP/lakehouse_runs"
          python -m swiss_grid_lakehouse.runs --times 2 --lake "$out" | tee "$RUNNER_TEMP/runs.txt"
          test "$(grep -c '^RUN n=.* status=SUCCESS$' "$RUNNER_TEMP/runs.txt")" -eq 2
          grep -q "merged inserted=0 updated=0" "$RUNNER_TEMP/runs.txt"
          grep -q "^HISTORY runs=2 success=2 failed=0$" "$RUNNER_TEMP/runs.txt"
