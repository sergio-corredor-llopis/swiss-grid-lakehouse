bundle: {name: swiss-grid-lakehouse}
variables:
  catalog: {description: Target catalog, default: workspace}
  schema:  {description: Target schema, default: swiss_grid}
  source:  {description: "Input of the scheduled run: api (secret scope entsoe) or the Volume path of a recorded XML file",
            default: api}
  schedule_cron: {description: "Quartz cron of the schedule, Europe/Zurich time; daily at 06:00 by default, hourly is 0 0 * * * ?",
                  default: "0 0 6 * * ?"}
  raw_volume: {description: "Unity Catalog Volume that holds the recorded input files",
               default: "/Volumes/${var.catalog}/${var.schema}/raw"}
resources:
  jobs:
    ch_load:
      name: ch-load
      max_concurrent_runs: 1
      schedule: {quartz_cron_expression: "${var.schedule_cron}", timezone_id: Europe/Zurich,
        pause_status: UNPAUSED}
      parameters:
        - {name: source, default: "${var.source}"}
      tasks:
        - task_key: bronze
          notebook_task: {notebook_path: ./notebooks/bronze_entsoe_ch_load.py,
            base_parameters: {source: "{{job.parameters.source}}", catalog: "${var.catalog}", schema: "${var.schema}"}}
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task: {notebook_path: ./notebooks/silver_ch_load.py,
            base_parameters: {catalog: "${var.catalog}", schema: "${var.schema}"}}
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task: {notebook_path: ./notebooks/gold_marts.py,
            base_parameters: {catalog: "${var.catalog}", schema: "${var.schema}"}}
        - task_key: run_history
          depends_on: [{task_key: bronze}, {task_key: silver}, {task_key: gold}]
          run_if: ALL_DONE
          notebook_task: {notebook_path: ./notebooks/run_history.py,
            base_parameters: {run_id: "{{job.run_id}}", started_at: "{{job.start_time.iso_datetime}}",
              target: ch-load, source: "{{job.parameters.source}}",
              catalog: "${var.catalog}", schema: "${var.schema}"}}
targets:
  dev: {mode: development, default: true}
  azure:
    resources:
      jobs:
        ch_load_azure:
          name: ch-load-azure
          max_concurrent_runs: 1
          schedule:
            quartz_cron_expression: "${var.schedule_cron}"
            timezone_id: Europe/Zurich
            pause_status: PAUSED
          tasks:
            - task_key: bronze_entsoe
              notebook_task:
                notebook_path: ./notebooks/bronze_entsoe_ch_load.py
                base_parameters:
                  source: "${var.raw_volume}/entsoe_ch_load_2026-08-30.xml"
                  catalog: "${var.catalog}"
                  schema: "${var.schema}"
            - task_key: bronze_swissgrid
              notebook_task:
                notebook_path: ./notebooks/bronze_swissgrid_energy.py
                base_parameters:
                  source: "${var.raw_volume}/swissgrid_ch_energy_2026-08-30.csv"
                  catalog: "${var.catalog}"
                  schema: "${var.schema}"
            - task_key: silver
              depends_on:
                - task_key: bronze_entsoe
                - task_key: bronze_swissgrid
              notebook_task:
                notebook_path: ./notebooks/silver_ch_load.py
                base_parameters:
                  catalog: "${var.catalog}"
                  schema: "${var.schema}"
            - task_key: reconcile
              depends_on:
                - task_key: silver
              notebook_task:
                notebook_path: ./notebooks/reconcile_daily.py
                base_parameters:
                  catalog: "${var.catalog}"
                  schema: "${var.schema}"
                  package: "${var.raw_volume}/ckan_package_show_2026-09-29.json"
                  csv: "${var.raw_volume}/ogd103_2026-08-30_31.csv"
                  state: "${var.raw_volume}/reconcile_state.json"
            - task_key: gold
              depends_on:
                - task_key: reconcile
              notebook_task:
                notebook_path: ./notebooks/gold_marts.py
                base_parameters:
                  catalog: "${var.catalog}"
                  schema: "${var.schema}"
            - task_key: run_history
              depends_on:
                - task_key: bronze_entsoe
                - task_key: bronze_swissgrid
                - task_key: silver
                - task_key: reconcile
                - task_key: gold
              run_if: ALL_DONE
              notebook_task:
                notebook_path: ./notebooks/run_history.py
                base_parameters:
                  run_id: "{{job.run_id}}"
                  started_at: "{{job.start_time.iso_datetime}}"
                  target: ch-load-azure
                  source: recorded
                  catalog: "${var.catalog}"
                  schema: "${var.schema}"
